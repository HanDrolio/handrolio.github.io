<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#050613"><title>COSM.OS // FREQUENCY ENGINE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050613;color:#eef4ff;font-family:system-ui,-apple-system,sans-serif}body{overscroll-behavior:none}#stage{position:fixed;inset:0;touch-action:none}#stage canvas{display:block;width:100%;height:100%}#top{position:fixed;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;pointer-events:none;text-shadow:0 2px 12px #000;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}#brand{font-weight:950;letter-spacing:.13em;font-size:clamp(15px,4vw,23px)}#brand small{display:block;font-size:9px;color:#9cb0c9;letter-spacing:.28em;margin-top:5px}#meter{font:700 11px ui-monospace,monospace;text-align:right;color:#9cf5e5}#panel{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:10px;right:10px;border:1px solid #9bb4ef55;border-radius:20px;padding:13px;background:linear-gradient(145deg,#131a32ec,#0a1027ed);box-shadow:0 8px 50px #0009;backdrop-filter:blur(18px);max-width:680px;margin:auto;transition:transform .25s,opacity .25s}#panel.hidden{transform:translateY(calc(100% + 40px));opacity:0;pointer-events:none}button,.file{background:#263153;color:#f4f8ff;border:1px solid #748bd67a;border-radius:11px;padding:10px 12px;font-size:12px;font-weight:800;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:active,.file:active{transform:scale(.96)}button.primary,.file{background:linear-gradient(130deg,#3b7da9,#7149bb);border-color:#b9b9ff}.row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.row>*{flex:1}#file{display:none}#name{font-size:12px;color:#d8e1ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 0 9px}#seek{width:100%;accent-color:#8cefff;touch-action:pan-x}#times{display:flex;justify-content:space-between;color:#94a9c4;font:11px ui-monospace,monospace;margin-bottom:9px}.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.setting{display:flex;flex-direction:column;gap:3px;font-size:10px;color:#acbed7}.setting input{width:100%;accent-color:#b398ff}.foot{font-size:10px;color:#8194b4;text-align:center;margin:9px 0 0}#toggle{position:fixed;right:12px;top:max(70px,env(safe-area-inset-top) + 58px);z-index:4;padding:9px 12px;background:#17203bc9}#status{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);pointer-events:none;color:#b7c5e7;text-align:center;font-size:13px;text-shadow:0 2px 8px #000;opacity:.9;max-width:85vw}#status.hide{display:none}@media(max-height:550px){#panel{padding:9px}.settings{display:none}.foot{display:none}#top{top:6px}#toggle{top:40px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head>
<body><div id="stage"></div><div id="top"><div id="brand">COSM.OS <span style="color:#a59aff">✦</span><small>FREQUENCY ENGINE // GALAXY</small></div><div id="meter">BASS <span id="bass">00</span>%<br>ENERGY <span id="energy">00</span>%</div></div><button id="toggle">☷ HIDE UI</button><div id="status">✦ Drag to orbit · Pinch to zoom<br>Load an MP3 to wake the galaxy</div>
<div id="panel"><div id="name">NO TRACK LOADED · IDLE COSMOS</div><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek through song"><div id="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="row"><label class="file" for="file">♫ LOAD MP3<input id="file" type="file" accept="audio/*,.mp3"></label><button class="primary" id="play">▶ PLAY</button><button id="shuffle">✧ RESEED</button><button id="full">⛶ FULL</button></div><div class="settings"><label class="setting">SENSITIVITY <span id="sensVal">1.5×</span><input id="sens" type="range" min=".5" max="3.5" step=".1" value="1.5"></label><label class="setting">GALAXY SPEED <span id="speedVal">1.0×</span><input id="speed" type="range" min=".2" max="3" step=".1" value="1"></label><label class="setting">PARTICLE GLOW <span id="glowVal">1.0×</span><input id="glow" type="range" min=".3" max="2" step=".1" value="1"></label><label class="setting">HUE SHIFT <span id="hueVal">0°</span><input id="hue" type="range" min="0" max="360" step="1" value="0"></label></div><div class="foot">3D PARTICLE GALAXY · TWO FINGERS TO ZOOM · YOUR MUSIC STAYS ON YOUR DEVICE</div></div>
<audio id="audio" playsinline preload="metadata"></audio>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id),stage=$('stage'),audio=$('audio');
let renderer,scene,camera,galaxy,material,geometry,stars,starGeo,starMat,core,halo,ring;
let count=innerWidth<700?6500:11500,positions,colors,original,phases,radii;
let yaw=.1,pitch=.22,dist=25,drag=null,touches=new Map(),lastPinch=0;
let ctx=null,analyser=null,source=null,bins=null,level=0,bass=0,mids=0,treble=0,beat=0,prevBass=0,clock=new THREE.Clock(),url=null,playing=false,seed=Math.random()*99999;
let sensitivity=1.5,speed=1,glow=1,hue=0,seekDrag=false;
const fmt=t=>{if(!Number.isFinite(t))return '0:00';return Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')};
const rng=(s)=>{let n=s>>>0;return()=>{n=(Math.imul(n,1664525)+1013904223)>>>0;return n/4294967296}};
function init(){
renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x030511,1);
renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x050616,.009);
camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,.1,250);
camera.position.set(0,6,25);
makeGalaxy();makeStars();makeCore();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6))});
animate();
}
function makeGalaxy(){
if(galaxy){scene.remove(galaxy);geometry.dispose();material.dispose()}
const rand=rng(Math.floor(seed)),arms=5;positions=new Float32Array(count*3);original=new Float32Array(count*3);colors=new Float32Array(count*3);phases=new Float32Array(count);radii=new Float32Array(count);
const inner=new THREE.Color('#67e8ff'),outer=new THREE.Color('#a57dff'),warm=new THREE.Color('#ff6bb6'),color=new THREE.Color();
for(let i=0;i<count;i++){
const radius=Math.pow(rand(),.72)*12.5+.2,arm=i%arms,angle=arm/arms*Math.PI*2+radius*.56+(rand()-.5)*(.24+radius*.038),scatter=(rand()-.5)*(.12+radius*.085);
const x=Math.cos(angle)*radius+scatter,z=Math.sin(angle)*radius+(rand()-.5)*(.12+radius*.08),y=(rand()-.5)*(.2+radius*.17);
const k=i*3;original[k]=x;original[k+1]=y;original[k+2]=z;positions[k]=x;positions[k+1]=y;positions[k+2]=z;
phases[i]=rand()*Math.PI*2;radii[i]=radius;
color.copy(inner).lerp(outer,Math.min(1,radius/12.5));if(rand()<.22)color.lerp(warm,.55);
colors[k]=color.r;colors[k+1]=color.g;colors[k+2]=color.b;
}
geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.BufferAttribute(positions,3).setUsage(THREE.DynamicDrawUsage));geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));
material=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexColors:true,uniforms:{uSize:{value:Math.min(devicePixelRatio||1,1.6)*2.6},uGlow:{value:1},uHue:{value:0},uPulse:{value:0}},vertexShader:`
attribute vec3 color;varying vec3 vColor;uniform float uSize;uniform float uGlow;uniform float uHue;uniform float uPulse;
vec3 hueShift(vec3 c,float a){vec3 axis=normalize(vec3(1.0));return c*cos(a)+cross(axis,c)*sin(a)+axis*dot(axis,c)*(1.0-cos(a));}
void main(){vColor=max(vec3(0.0),hueShift(color,uHue));vec4 mv=modelViewMatrix*vec4(position,1.0);gl_Position=projectionMatrix*mv;gl_PointSize=clamp(uSize*(1.0+uPulse*.9)*uGlow*(30.0/max(4.0,-mv.z)),1.0,14.0);}
`,fragmentShader:`varying vec3 vColor;void main(){float r=length(gl_PointCoord-.5);float a=smoothstep(.5,.03,r);float hot=exp(-r*r*32.0);gl_FragColor=vec4(vColor*(1.0+hot*.8),a*.85);}`});
galaxy=new THREE.Points(geometry,material);scene.add(galaxy);
}
function makeStars(){const rand=rng(9012),p=new Float32Array(2400*3);for(let i=0;i<2400;i++){const theta=rand()*Math.PI*2,v=rand()*2-1,r=55+rand()*75,t=Math.sqrt(1-v*v);p[i*3]=r*t*Math.cos(theta);p[i*3+1]=r*v;p[i*3+2]=r*t*Math.sin(theta)}starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.BufferAttribute(p,3));starMat=new THREE.PointsMaterial({color:0x7f99cb,size:.12,transparent:true,opacity:.65,depthWrite:false});stars=new THREE.Points(starGeo,starMat);scene.add(stars)}
function makeCore(){core=new THREE.Mesh(new THREE.IcosahedronGeometry(.62,3),new THREE.MeshBasicMaterial({color:0xc3f9ff,transparent:true,opacity:.9}));scene.add(core);halo=new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlow(),color:0x68aaff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));halo.scale.set(9,9,1);scene.add(halo);ring=new THREE.Mesh(new THREE.TorusGeometry(4.5,.018,4,120),new THREE.MeshBasicMaterial({color:0x8d75ff,transparent:true,opacity:.5}));ring.rotation.x=Math.PI/2.6;scene.add(ring)}
function makeGlow(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),grad=g.createRadialGradient(64,64,0,64,64,64);grad.addColorStop(0,'rgba(255,255,255,1)');grad.addColorStop(.15,'rgba(160,220,255,.55)');grad.addColorStop(.45,'rgba(70,80,255,.15)');grad.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=grad;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
function connectAudio(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();if(!source){source=ctx.createMediaElementSource(audio);analyser=ctx.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.76;bins=new Uint8Array(analyser.frequencyBinCount);source.connect(analyser);analyser.connect(ctx.destination)}}catch(e){$('name').textContent='Audio analyzer error: '+e.message}}
function spectrum(dt,t){if(analyser&&!audio.paused){analyser.getByteFrequencyData(bins);const avg=(a,b)=>{let sum=0;for(let i=a;i<b;i++)sum+=bins[i];return sum/(b-a)/255};const k=Math.min(1,dt*11);bass+=(avg(1,13)-bass)*k;mids+=(avg(13,110)-mids)*k;treble+=(avg(110,300)-treble)*k;level+=(Math.min(1,bass*.55+mids*.6+treble*.2)-level)*k;beat=Math.max(0,beat-dt*3);if(bass>prevBass+.08&&bass>.18)beat=1;prevBass=bass}else{bass+=(0-bass)*Math.min(1,dt*3);mids+=(0-mids)*Math.min(1,dt*3);treble+=(0-treble)*Math.min(1,dt*3);level+=(0-level)*Math.min(1,dt*3);beat=Math.max(0,beat-dt*2)}$('bass').textContent=String(Math.round(bass*100*sensitivity)).padStart(2,'0');$('energy').textContent=String(Math.round(level*100*sensitivity)).padStart(2,'0')}
function animate(){requestAnimationFrame(animate);const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;spectrum(dt,t);
const pulse=Math.min(2.5,(bass*2.1+mids*.8+beat*.7)*sensitivity);
const pos=geometry.attributes.position.array;
for(let i=0;i<count;i++){const k=i*3,r=radii[i],phase=phases[i],a=t*(.07+1/(r+4)*.3)*speed;const cs=Math.cos(a),sn=Math.sin(a),x=original[k],z=original[k+2],wave=Math.sin(t*1.8+phase+r*.7);
pos[k]=(x*cs-z*sn)*(1+pulse*.11);
pos[k+2]=(x*sn+z*cs)*(1+pulse*.11);
pos[k+1]=original[k+1]+wave*(.05+treble*sensitivity*.7)+Math.sin(t*1.2+r*.9+phase)*mids*sensitivity*.8;
}
geometry.attributes.position.needsUpdate=true;
material.uniforms.uGlow.value=glow;material.uniforms.uHue.value=hue*Math.PI/180;material.uniforms.uPulse.value=pulse;
core.scale.setScalar(1+pulse*.55);core.rotation.y+=dt*.35;halo.scale.setScalar(8+pulse*5);halo.material.opacity=.55+Math.min(.45,level*sensitivity);ring.scale.setScalar(1+pulse*.13);ring.rotation.z+=dt*.12*speed;
galaxy.rotation.y+=dt*.025*speed;stars.rotation.y+=dt*.002;
if(!drag&&touches.size===0)yaw+=dt*.035*speed;
pitch=THREE.MathUtils.clamp(pitch,-1.42,1.42);
camera.position.set(dist*Math.cos(pitch)*Math.sin(yaw),dist*Math.sin(pitch),dist*Math.cos(pitch)*Math.cos(yaw));camera.lookAt(0,0,0);
renderer.render(scene,camera);
if(!seekDrag&&Number.isFinite(audio.duration)&&audio.duration>0){$('seek').value=String(Math.round(audio.currentTime/audio.duration*1000))}$('elapsed').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration)}
function pointerDown(e){if(e.target!==renderer.domElement)return;e.preventDefault();stage.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY};lastPinch=0}
function pointerMove(e){if(!touches.has(e.pointerId))return;e.preventDefault();const prev=touches.get(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){yaw-=(e.clientX-prev.x)*.007;pitch+=(e.clientY-prev.y)*.007}else if(touches.size>=2){const pts=[...touches.values()],d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(lastPinch)dist=THREE.MathUtils.clamp(dist*lastPinch/Math.max(1,d),8,75);lastPinch=d}}
function pointerUp(e){touches.delete(e.pointerId);lastPinch=0;if(!touches.size)drag=null}
stage.addEventListener('pointerdown',pointerDown);stage.addEventListener('pointermove',pointerMove);stage.addEventListener('pointerup',pointerUp);stage.addEventListener('pointercancel',pointerUp);stage.addEventListener('lostpointercapture',pointerUp);stage.addEventListener('wheel',e=>{dist=THREE.MathUtils.clamp(dist+e.deltaY*.025,8,75)},{passive:true});
$('file').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);audio.src=url;audio.load();$('name').textContent='♫ '+f.name;$('status').classList.add('hide');connectAudio();audio.play().then(()=>{$('play').textContent='Ⅱ PAUSE'}).catch(()=>{$('play').textContent='▶ PLAY'})});
$('play').onclick=()=>{if(!audio.src){$('name').textContent='LOAD AN MP3 FIRST';return}connectAudio();if(audio.paused)audio.play().then(()=>{$('play').textContent='Ⅱ PAUSE'}).catch(()=>{});else{audio.pause();$('play').textContent='▶ PLAY'}};
audio.addEventListener('ended',()=>{$('play').textContent='▶ PLAY'});
$('seek').addEventListener('pointerdown',()=>seekDrag=true);$('seek').addEventListener('input',()=>{if(Number.isFinite(audio.duration))audio.currentTime=+$('seek').value/1000*audio.duration});$('seek').addEventListener('change',()=>seekDrag=false);addEventListener('pointerup',()=>seekDrag=false);
$('shuffle').onclick=()=>{seed=Math.random()*1e9;makeGalaxy()};
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else{$('panel').classList.add('hidden');$('toggle').textContent='☷ SHOW UI'}}catch(e){$('panel').classList.add('hidden');$('toggle').textContent='☷ SHOW UI'}};
$('toggle').onclick=()=>{const hidden=$('panel').classList.toggle('hidden');$('toggle').textContent=hidden?'☷ SHOW UI':'☷ HIDE UI'};
for(const id of ['sens','speed','glow','hue'])$(id).addEventListener('input',()=>{sensitivity=+$('sens').value;speed=+$('speed').value;glow=+$('glow').value;hue=+$('hue').value;$('sensVal').textContent=sensitivity.toFixed(1)+'×';$('speedVal').textContent=speed.toFixed(1)+'×';$('glowVal').textContent=glow.toFixed(1)+'×';$('hueVal').textContent=hue+'°'});
addEventListener('pagehide',()=>{if(url)URL.revokeObjectURL(url)});
try{init()}catch(e){$('status').textContent='3D graphics unavailable: '+e.message;console.error(e)}
</script></body></html>
