$('file').addEventListener('change',async e=>{
 const f=e.target.files?.[0];if(!f)return;
 if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);
 audio.src=url;audio.load();$('track').textContent='♫ '+f.name;$('play').textContent='▶ PLAY';averageBass=0;lastBeat=-20;
 connectSound();
 try{await audio.play();$('play').textContent='Ⅱ PAUSE';say('THE UNIVERSE IS LISTENING ✦',3)}catch(err){say('MP3 LOADED · TAP PLAY',5)}
});
$('play').addEventListener('click',async()=>{
 if(!audio.src){say('LOAD AN MP3 FIRST',4);return}
 connectSound();
 if(audio.paused){try{await audio.play();$('play').textContent='Ⅱ PAUSE';say('THE UNIVERSE IS LISTENING ✦',2)}catch(e){say('PLAYBACK FAILED: '+e.message,4)}}
 else{audio.pause();$('play').textContent='▶ PLAY';say('PAUSED',2)}
});
audio.addEventListener('ended',()=>{$('play').textContent='▶ PLAY';say('TRACK ENDED',4)});
audio.addEventListener('error',()=>{say('AUDIO FORMAT NOT SUPPORTED',5);$('play').textContent='▶ PLAY'});
addEventListener('pagehide',()=>{if(url)URL.revokeObjectURL(url)});
try{init()}catch(e){console.error(e);say('3D ERROR: '+e.message,25)}
</script></body></html>
