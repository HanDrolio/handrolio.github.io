<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080b16"><title>HANCADE: CRYPT OF THE C-MINUS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#30364d,#111422 75%);color:#25273b;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#app{height:100dvh;width:min(100%,900px);margin:auto;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:9px;background:linear-gradient(130deg,#c9b8e3,#a49ac9 58%,#8f8ab8);border:3px solid #68658f;border-radius:22px 22px 48px 22px;box-shadow:inset 4px 4px #e6d9fa,inset -6px -7px #77759d,0 14px 35px #05060a}
#brand{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 9px;color:#3d3765;font-size:clamp(12px,3vw,20px);font-weight:1000;letter-spacing:1px}#brand small{font-size:9px;font-weight:800;letter-spacing:2px;color:#696487}
#screenShell{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px;background:#4b5067;border:5px solid #5b5d7c;border-radius:16px 16px 30px 16px;padding:8px;box-shadow:inset 3px 4px #303447,0 3px #e1d4f4}
#hud{display:flex;justify-content:space-between;align-items:center;gap:6px;color:#d5e6cb;font-family:monospace;font-size:clamp(9px,1.8vw,13px);font-weight:bold}#hud span:first-child{color:#ffd890}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#111723;border:3px solid #272b3b;overflow:hidden}
canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;aspect-ratio:320/192;image-rendering:pixelated;image-rendering:crisp-edges;background:#10131e}
#screenFoot{display:flex;justify-content:space-between;color:#b5b4c6;font-size:9px;letter-spacing:2px}
#controls{height:clamp(155px,33dvh,235px);display:flex;justify-content:space-between;align-items:center;padding:4px clamp(6px,4vw,40px);gap:10px}
#dpad{display:grid;grid-template-columns:repeat(3,clamp(43px,12vw,62px));grid-template-rows:repeat(3,clamp(43px,12vw,62px));align-items:stretch;justify-content:center;gap:0;filter:drop-shadow(2px 4px 1px #6e688d)}
#dpad button{border-radius:3px;background:#34374c;border:1px solid #1c2032;color:#d5d3e3;font-size:20px;box-shadow:inset 2px 2px #62637b;touch-action:none}
#dpad [data-dir=up]{grid-column:2;grid-row:1;border-radius:6px 6px 0 0}#dpad [data-dir=left]{grid-column:1;grid-row:2;border-radius:6px 0 0 6px}#dpad [data-dir=right]{grid-column:3;grid-row:2;border-radius:0 6px 6px 0}#dpad [data-dir=down]{grid-column:2;grid-row:3;border-radius:0 0 6px 6px}
#dpad:before{content:"";grid-column:2;grid-row:2;background:#34374c;box-shadow:inset 0 0 0 10px #34374c}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:none}button:active,.held{filter:brightness(1.5)!important}
#attack{width:clamp(78px,22vw,125px);height:clamp(78px,22vw,125px);border-radius:50%;background:linear-gradient(140deg,#e76b7d,#aa3859);border:4px solid #81324f;color:white;font-weight:900;font-size:clamp(13px,2.5vw,20px);box-shadow:inset 3px 3px #f8a2ad,3px 6px #6f648b;transform:rotate(-18deg)}
#utility{display:flex;flex-direction:column;align-items:center;gap:7px}#utility button{font-size:10px;font-weight:800;color:#403b64;background:#bdb5d6;border:2px solid #797397;border-radius:20px;padding:8px;box-shadow:inset 1px 2px #f2e6ff}#tip{font-size:9px;color:#4f496e;text-align:center}
#speakers{display:flex;gap:5px;justify-content:flex-end;padding:0 14px 2px}#speakers i{width:4px;height:13px;background:#777293;border-radius:4px;transform:rotate(-25deg)}
@media(orientation:landscape){#app{width:min(100%,1100px);display:grid;grid-template-columns:minmax(0,1fr) minmax(215px,32%);grid-template-rows:24px minmax(0,1fr);column-gap:10px;border-radius:18px 18px 42px 18px}#brand{grid-column:1/-1}#screenShell{grid-column:1;grid-row:2}#controls{grid-column:2;grid-row:2;height:auto;padding:0;gap:4px;align-items:center}#dpad{grid-template-columns:repeat(3,clamp(30px,7vh,54px));grid-template-rows:repeat(3,clamp(30px,7vh,54px))}#attack{width:clamp(55px,15vh,105px);height:clamp(55px,15vh,105px)}#utility{position:absolute;bottom:max(5px,env(safe-area-inset-bottom));right:17%;flex-direction:row;gap:4px}#utility button{font-size:8px;padding:4px}#tip,#speakers{display:none}}
@media(orientation:portrait){#app{max-width:570px}#controls{flex:1;max-height:250px;min-height:160px}#screenShell{flex:0 1 auto;height:min(50dvh,380px)}#stage{min-height:0}#speakers{margin-top:auto}}
@media(max-height:380px) and (orientation:landscape){#brand{font-size:11px}#screenShell{padding:4px}#dpad{grid-template-columns:repeat(3,30px);grid-template-rows:repeat(3,30px)}#attack{width:60px;height:60px;font-size:12px}#hud{font-size:9px}}
</style></head>
<body><div id="app"><div id="brand"><span>✦ HANCADE <small>8-BIT POCKET SYSTEM</small></span><span>◈ C-MINUS EDITION</span></div><div id="screenShell"><div id="hud"><span>⚔ CRYPT OF THE C-MINUS</span><span id="stats">HP ♥♥♥♥♥ FLOOR 1 GOLD 0</span></div><div id="stage"><canvas id="game" width="320" height="192" aria-label="Pixel dungeon crawler"></canvas></div><div id="screenFoot"><span>● POWER</span><span>DOT MATRIX COLOR</span></div></div><div id="controls"><div id="dpad"><button data-dir="up" aria-label="Up">▲</button><button data-dir="left" aria-label="Left">◀</button><button data-dir="right" aria-label="Right">▶</button><button data-dir="down" aria-label="Down">▼</button></div><div id="utility"><button id="sound">♫ SOUND ON</button><button id="restart">↻ NEW RUN</button><span id="tip">ARROWS / WASD + SPACE</span></div><button id="attack">⚔<br>ATTACK</button></div><div id="speakers" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></div>
<script>
(()=>{'use strict';
const C=document.getElementById('game'),x=C.getContext('2d'),W=20,H=12,T=16,stats=document.getElementById('stats');
x.imageSmoothingEnabled=false;
let map=[],enemies=[],loot=[],stairs={x:18,y:10},p={x:1,y:1,hp:5,max:5,gold:0,dir:'down',swing:0},floor=1,mode='title',message='FIND THE STAIRS',msgUntil=0,flash=0,shake=0,clock=0,last=0,moveWait=0,enemyWait=0,soundOn=true,audio=null,held=new Set(),seed=1;
const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const rnd=n=>Math.floor(rand()*n);
const color={wall:'#36334d',edge:'#756588',floor:'#1d2231',floor2:'#22293a',gold:'#ffd86b',red:'#ed6674',green:'#7cda97',blue:'#74bdf5'};
function beep(freq=400,dur=.07,type='square',vol=.035){if(!soundOn)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(50,freq*.65),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.01)}catch(e){}}
function announce(s){message=s;msgUntil=clock+2.1}
function room(cx,cy,rw,rh){for(let y=cy;y<cy+rh;y++)for(let xx=cx;xx<cx+rw;xx++)if(xx>0&&y>0&&xx<W-1&&y<H-1)map[y][xx]=0}
function generate(){seed=(Date.now()+floor*7919)>>>0;map=Array.from({length:H},()=>Array(W).fill(1));let rooms=[{x:1,y:1,w:5,h:4}];room(1,1,5,4);
for(let i=0;i<8;i++){let rw=3+rnd(4),rh=3+rnd(3),rx=1+rnd(W-rw-1),ry=1+rnd(H-rh-1);room(rx,ry,rw,rh);rooms.push({x:rx,y:ry,w:rw,h:rh})}
for(let i=1;i<rooms.length;i++){let a=rooms[i-1],b=rooms[i],ax=a.x+Math.floor(a.w/2),ay=a.y+Math.floor(a.h/2),bx=b.x+Math.floor(b.w/2),by=b.y+Math.floor(b.h/2);for(let xx=Math.min(ax,bx);xx<=Math.max(ax,bx);xx++)map[ay][xx]=0;for(let yy=Math.min(ay,by);yy<=Math.max(ay,by);yy++)map[yy][bx]=0}
p.x=2;p.y=2;enemies=[];loot=[];
let open=[];for(let y=1;y<H-1;y++)for(let xx=1;xx<W-1;xx++)if(!map[y][xx]&&Math.abs(xx-p.x)+Math.abs(y-p.y)>5)open.push({x:xx,y});
function take(){if(!open.length)return{x:18,y:10};return open.splice(rnd(open.length),1)[0]}
stairs=take();for(let i=0;i<Math.min(4+floor*2,17);i++){let q=take();enemies.push({x:q.x,y:q.y,hp:floor>2&&rand()<.35?3:2,kind:rand()<.25?'bat':'slime',tick:rnd(3)})}
for(let i=0;i<7;i++){let q=take();loot.push({x:q.x,y:q.y,type:rand()<.22?'heart':'coin'})}
announce('FLOOR '+floor+' · FIND THE GOLD STAIRS')}
function solid(xx,yy){return xx<0||yy<0||xx>=W||yy>=H||map[yy][xx]===1}
function monster(xx,yy){return enemies.find(e=>e.x===xx&&e.y===yy)}
function pick(){for(let i=loot.length-1;i>=0;i--){let l=loot[i];if(l.x===p.x&&l.y===p.y){if(l.type==='heart'){p.hp=Math.min(p.max,p.hp+1);announce('+1 HEALTH');beep(650,.18,'sine')}else{p.gold+=10;announce('+10 GOLD');beep(880,.11)}loot.splice(i,1)}}if(p.x===stairs.x&&p.y===stairs.y){floor++;p.hp=Math.min(p.max,p.hp+1);beep(600,.3,'triangle');generate()}}
function hitPlayer(){p.hp--;flash=.3;shake=.15;beep(115,.25,'sawtooth');announce('OUCH! -1 HP');if(p.hp<=0){mode='dead';announce('GAME OVER')}}
function attack(){if(mode==='title'||mode==='dead'){newRun();return}if(mode!=='play')return;p.swing=.18;let offsets=[[0,-1],[0,1],[-1,0],[1,0]];let d={up:0,down:1,left:2,right:3}[p.dir],targets=[offsets[d],...offsets.filter((_,i)=>i!==d)];let found=false;for(let i=0;i<targets.length;i++){let [dx,dy]=targets[i],e=monster(p.x+dx,p.y+dy);if(e){e.hp--;found=true;beep(180,.09,'sawtooth');shake=.08;if(e.hp<=0){enemies.splice(enemies.indexOf(e),1);p.gold+=5;announce('MONSTER DOWN +5 GOLD');beep(540,.15)}else announce('HIT!');break}}if(!found)beep(270,.05,'triangle')}
function move(dir){if(mode==='title'||mode==='dead'){newRun();return}if(mode!=='play')return;p.dir=dir;let [dx,dy]={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[dir],xx=p.x+dx,yy=p.y+dy;if(solid(xx,yy)){beep(90,.025);return}if(monster(xx,yy)){attack();return}p.x=xx;p.y=yy;pick()}
function enemyTurn(){if(mode!=='play')return;for(let e of enemies){if(rand()<.26)continue;let dx=p.x-e.x,dy=p.y-e.y,dist=Math.abs(dx)+Math.abs(dy);if(dist===1){if(rand()<.55)hitPlayer();if(mode!=='play')return;continue}let choices=[];if(dist<7){if(Math.abs(dx)>Math.abs(dy)){choices.push([Math.sign(dx),0],[0,Math.sign(dy)])}else choices.push([0,Math.sign(dy)],[Math.sign(dx),0])}else choices=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>rand()-.5);for(let [sx,sy] of choices){let xx=e.x+sx,yy=e.y+sy;if(!solid(xx,yy)&&!monster(xx,yy)&&!(p.x===xx&&p.y===yy)&&!(stairs.x===xx&&stairs.y===yy)){e.x=xx;e.y=yy;break}}}}
function newRun(){p={x:2,y:2,hp:5,max:5,gold:0,dir:'down',swing:0};floor=1;mode='play';generate();beep(450,.12)}
function rect(xx,yy,w,h,c){x.fillStyle=c;x.fillRect(xx,yy,w,h)}
function sprite(px,py,kind){let xx=px*T,yy=py*T;if(kind==='hero'){rect(xx+5,yy+2,6,4,'#f3cb8e');rect(xx+4,yy+1,8,3,'#d5a75d');rect(xx+3,yy+6,10,7,'#5c9cf0');rect(xx+4,yy+13,3,3,'#c9c7dd');rect(xx+9,yy+13,3,3,'#c9c7dd');rect(xx+6,yy+4,1,1,'#241a27');rect(xx+10,yy+4,1,1,'#241a27');if(p.swing>0){let d={up:[7,-3],down:[7,13],left:[-3,6],right:[13,6]}[p.dir];rect(xx+d[0],yy+d[1],4,8,'#fbe9b6')}}else if(kind==='slime'){rect(xx+3,yy+7,10,7,'#3e8e71');rect(xx+4,yy+5,8,8,'#6fda96');rect(xx+5,yy+9,2,2,'#1a3c32');rect(xx+10,yy+9,2,2,'#1a3c32')}else if(kind==='bat'){rect(xx+1,yy+5,5,7,'#b477bc');rect(xx+10,yy+5,5,7,'#b477bc');rect(xx+5,yy+7,6,6,'#d79bd8');rect(xx+6,yy+9,1,2,'#22162b');rect(xx+10,yy+9,1,2,'#22162b')}}
function draw(){rect(0,0,320,192,'#0d101a');for(let y=0;y<H;y++)for(let xx=0;xx<W;xx++){let px=xx*T,py=y*T;if(map[y][xx]){rect(px,py,16,16,color.wall);rect(px,py,16,3,color.edge);rect(px+2,py+8,6,1,'#4b435f');rect(px+9,py+13,6,1,'#29283c')}else{rect(px,py,16,16,(xx+y)%3===0?color.floor2:color.floor);if((xx*13+y*7)%9===0)rect(px+4,py+11,2,1,'#31364a')}}rect(stairs.x*T+2,stairs.y*T+2,12,12,'#705127');rect(stairs.x*T+4,stairs.y*T+4,8,8,color.gold);rect(stairs.x*T+6,stairs.y*T+6,4,4,'#a67c32');
for(let l of loot){let xx=l.x*T,yy=l.y*T;if(l.type==='heart'){rect(xx+4,yy+5,8,7,'#e35c75');rect(xx+5,yy+3,2,3,'#e35c75');rect(xx+9,yy+3,2,3,'#e35c75')}else{rect(xx+5,yy+4,7,9,'#efbd56');rect(xx+7,yy+5,3,7,'#ffe59a')}}
for(let e of enemies)sprite(e.x,e.y,e.kind);sprite(p.x,p.y,'hero');
if(flash>0){x.fillStyle='rgba(245,70,75,.28)';x.fillRect(0,0,320,192)}
if(clock<msgUntil&&mode==='play'){rect(26,169,268,19,'#0b0d19');x.strokeStyle='#8572aa';x.strokeRect(26,169,268,19);x.fillStyle='#fff2ba';x.font='9px monospace';x.textAlign='center';x.fillText(message,160,182)}
if(mode==='title'||mode==='dead'){x.fillStyle='rgba(5,6,15,.88)';x.fillRect(0,0,320,192);x.textAlign='center';x.fillStyle='#e5baff';x.font='bold 17px monospace';x.fillText('CRYPT OF THE',160,56);x.fillStyle='#ffe17b';x.fillText('C-MINUS',160,77);x.font='10px monospace';x.fillStyle='#f5f1dc';x.fillText(mode==='dead'?'GAME OVER · GOLD '+p.gold:'8-BIT DUNGEON CRAWLER',160,104);x.fillText('TAP ATTACK TO '+(mode==='dead'?'RETRY':'START'),160,126);x.fillStyle='#a6a3bd';x.fillText('MOVE · SLASH · LOOT · DESCEND',160,149)}}
function frame(t){let dt=Math.min(.05,(t-last)/1000||.016);last=t;clock+=dt;p.swing=Math.max(0,p.swing-dt);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt);moveWait-=dt;enemyWait-=dt;if(mode==='play'){if(moveWait<=0&&held.size){move([...held][0]);moveWait=.135}if(enemyWait<=0){enemyTurn();enemyWait=Math.max(.28,.8-floor*.035)}}draw();stats.textContent='HP '+ '♥'.repeat(Math.max(0,p.hp))+'♡'.repeat(Math.max(0,p.max-p.hp))+'  FLOOR '+floor+'  GOLD '+p.gold;requestAnimationFrame(frame)}
document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held.add(d);move(d);moveWait=.19;b.classList.add('held')});let up=e=>{held.delete(d);b.classList.remove('held')};b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});
const atk=document.getElementById('attack');atk.addEventListener('pointerdown',e=>{e.preventDefault();attack()});document.getElementById('restart').onclick=newRun;document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'♫ SOUND ON':'♫ SOUND OFF';if(soundOn)beep(600,.1)};
document.addEventListener('keydown',e=>{let d={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'}[e.code];if(d){e.preventDefault();if(!e.repeat)move(d);held.add(d)}else if(e.code==='Space'){e.preventDefault();if(!e.repeat)attack()}});document.addEventListener('keyup',e=>{let d={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'}[e.code];if(d)held.delete(d)});
window.addEventListener('blur',()=>held.clear());generate();mode='title';requestAnimationFrame(frame);
})();
</script></body></html>
