<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101628"><title>VEGGIE NINJA · HANCADE</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1222;color:#fff;font-family:system-ui,Arial,sans-serif;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#app{position:relative;width:100%;height:100dvh;overflow:hidden;background:radial-gradient(circle at 50% 45%,#293e49,#11172b 70%)}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none;font-weight:900;text-shadow:0 2px 2px #000}#hud span{background:#111b31b9;border:1px solid #6c806b;border-radius:12px;padding:7px 10px;font-size:clamp(12px,3vw,19px)}#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#090f1cba;padding:18px;overflow:auto}#panel{background:linear-gradient(160deg,#26394b,#151d32);border:3px solid #a3bc70;border-radius:24px;box-shadow:0 14px 60px #000a;max-width:510px;width:100%;padding:20px;text-align:center}h1{margin:0;font-size:clamp(27px,8vw,46px);color:#c4ef78;letter-spacing:1px;text-shadow:3px 4px #344e2e}h2{font-size:17px;margin:7px 0}p{margin:9px 0;color:#c8d5df;font-size:14px}button{background:#bce879;border:0;color:#1b2d24;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:900;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.96)}#blades{display:flex;gap:7px;overflow-x:auto;padding:8px 0;touch-action:pan-x}#blades button{flex:1;min-width:100px;background:#273d4d;border:2px solid #648177;color:white;font-size:12px;padding:10px 6px}#blades button.active{border-color:#d6f486;background:#3e583a}#blades button:disabled{opacity:.6}#message{color:#ffdd83;font-size:12px;min-height:16px}#hint{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));width:100%;text-align:center;pointer-events:none;font-size:12px;color:#c9d7d9a8}#sound{position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom));background:#233b49;color:#fff;border:1px solid #7eac9b;padding:8px;font-size:12px;z-index:2}@media(max-height:440px){#panel{padding:9px 15px}h1{font-size:25px}p{margin:4px 0}#blades{padding:3px 0}#blades button{padding:6px 4px}}
</style></head><body><div id="app"><canvas id="game"></canvas><div id="hud"><span id="score">🥕 0</span><span id="time">⏱ 60</span><span id="lives">🔪 0 SLICED</span></div><div id="hint">MULTI-TOUCH SLASHING · ROTTEN VEGGIES COST 25 POINTS ☠️</div><button id="sound">🔊 ON</button><div id="menu"><div id="panel"><h1>🥷 VEGGIE NINJA</h1><h2 id="headline">SLICE THE HARVEST!</h2><p id="summary">Swipe with one or multiple fingers! Each finger swings its own blade. No lives, just a 60-second score chase.</p><p id="wallet">🪙 0 coins</p><div id="blades"></div><p id="message"></p><button id="start">⚔️ START SLICING</button><p>60 seconds · No lives · Slice as many as you can</p></div></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);let w=0,h=0,dpr=1,objects=[],particles=[],trails=[],running=false,score=0,sliced=0,seconds=60,elapsed=0,spawn=0,last=0,combo=0,comboClock=0,runCoins=0,audio=null,sound=true,pointers=new Map(),blade=0,shake=0;const types=[{name:'CARROT',color:'#f38b37',leaf:'#6cd66b',points:10,shape:'carrot'},{name:'TOMATO',color:'#f35c61',leaf:'#78e27e',points:10,shape:'round'},{name:'BROCCOLI',color:'#69ce79',leaf:'#4c9c65',points:15,shape:'broccoli'},{name:'EGGPLANT',color:'#a16ee2',leaf:'#7fdb82',points:15,shape:'egg'},{name:'CORN',color:'#f7d75e',leaf:'#78c85b',points:20,shape:'corn'}];const blades=[{name:'BAMBOO',price:0,color:'#e8f4ca',width:4},{name:'NEON KATANA',price:100,color:'#69ffde',width:6},{name:'FIRE SABER',price:250,color:'#ff9555',width:8},{name:'COSMIC EDGE',price:500,color:'#c58cff',width:10}];let save={coins:0,owned:[0],selected:0,best:0};try{let s=JSON.parse(localStorage.getItem('veggieNinjaSave')||'null');if(s&&Number.isFinite(s.coins)&&Array.isArray(s.owned))save={...save,...s}}catch(e){}blade=blades[save.selected]?save.selected:0;const persist=()=>{try{localStorage.setItem('veggieNinjaSave',JSON.stringify(save))}catch(e){}};function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function tone(f=440,len=.08){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();let t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.55,t+len);g.gain.setValueAtTime(.065,t);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+len+.01)}catch(e){}}function renderBlades(){let holder=$('blades');holder.replaceChildren();blades.forEach((b,i)=>{let owned=save.owned.includes(i),selected=blade===i,btn=document.createElement('button');btn.className=selected?'active':'';btn.textContent=(selected?'✓ ':'⚔️ ')+b.name+' · '+(owned?'OWNED':b.price+' 🪙');btn.onclick=()=>{if(owned){blade=i;save.selected=i;$('message').textContent='EQUIPPED '+b.name;tone(680)}else if(save.coins>=b.price){save.coins-=b.price;save.owned.push(i);blade=i;save.selected=i;$('message').textContent='UNLOCKED '+b.name+'!';tone(880,.18)}else{$('message').textContent='NEED '+(b.price-save.coins)+' MORE COINS'}persist();renderBlades()};holder.appendChild(btn)});$('wallet').textContent='🪙 '+save.coins+' coins · BEST '+save.best}function start(){objects=[];particles=[];trails=[];running=true;score=0;sliced=0;seconds=60;elapsed=0;spawn=0;combo=0;comboClock=0;runCoins=0;pointers.clear();$('menu').style.display='none';tone(600,.12);hud()}function finish(){if(!running)return;running=false;save.coins+=runCoins;save.best=Math.max(save.best,score);persist();$('headline').textContent='TIME UP!';$('summary').textContent='SLICED '+sliced+' VEGGIES · SCORE '+score+' · EARNED '+runCoins+' COINS · BEST '+save.best;$('start').textContent='⚔️ PLAY AGAIN';$('menu').style.display='flex';$('message').textContent='';renderBlades();tone(160,.3)}function hud(){$('score').textContent='🥕 '+score;$('time').textContent='⏱ '+Math.ceil(seconds);$('lives').textContent='🔪 '+sliced+' SLICED'}function launch(){let rotten=Math.random()<Math.min(.18,.07+elapsed*.0016);let kind=Math.floor(Math.random()*types.length),r=Math.max(17,Math.min(30,w*.045));let x=r+Math.random()*(w-r*2),vy=-(Math.max(520,h*.85)+Math.random()*130),vx=(Math.random()-.5)*200;objects.push({x,y:h+r+5,vx,vy,r,kind,rotten,rot:Math.random()*6.28,spin:(Math.random()-.5)*3,cut:false})}function burst(o){let c=o.rotten?'#a3b15d':types[o.kind].color;for(let i=0;i<16;i++){let a=Math.random()*6.283,s=60+Math.random()*210;particles.push({x:o.x,y:o.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.4,color:c,r:2+Math.random()*4})}}function slice(o){o.cut=true;burst(o);shake=.09;if(o.rotten){combo=0;score=Math.max(0,score-25);tone(105,.22)}else{sliced++;combo=comboClock>0?combo+1:1;comboClock=.85;let pts=types[o.kind].points*Math.min(combo,5);score+=pts;runCoins+=Math.max(1,Math.ceil(pts/10));tone(340+Math.min(combo,8)*70,.1)}hud()}function segmentHit(ax,ay,bx,by,cx,cy,r){let dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?Math.max(0,Math.min(1,((cx-ax)*dx+(cy-ay)*dy)/l)):0;return Math.hypot(cx-(ax+t*dx),cy-(ay+t*dy))<r}function swipe(id,x,y){if(!running)return;const prev=pointers.get(id);if(prev){trails.push({x1:prev.x,y1:prev.y,x2:x,y2:y,life:.16});for(let o of objects)if(!o.cut&&segmentHit(prev.x,prev.y,x,y,o.x,o.y,o.r+5))slice(o)}pointers.set(id,{x,y})}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(running)tone(210,.035)});
canvas.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId))swipe(e.pointerId,e.clientX,e.clientY)});
function release(e){pointers.delete(e.pointerId)}
canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('dblclick',e=>e.preventDefault());$('start').onclick=start;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 ON':'🔇 OFF';if(sound)tone(520)};function veggie(o){let t=types[o.kind],r=o.r;ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rot);ctx.shadowColor='#0008';ctx.shadowBlur=8;ctx.fillStyle=o.rotten?'#666e3e':t.color;ctx.strokeStyle=o.rotten?'#303b26':'#ffffff50';ctx.lineWidth=2;if(t.shape==='carrot'){ctx.beginPath();ctx.moveTo(-r*.65,-r*.55);ctx.lineTo(r*.65,-r*.55);ctx.lineTo(0,r*1.2);ctx.closePath();ctx.fill();ctx.stroke()}else if(t.shape==='broccoli'){ctx.fillStyle='#78b879';ctx.fillRect(-r*.23,0,r*.46,r*.85);ctx.fillStyle=o.rotten?'#737941':t.color;for(let i=-1;i<=1;i++){ctx.beginPath();ctx.arc(i*r*.47,-r*.22,r*.52,0,7);ctx.fill()}}else{ctx.beginPath();ctx.ellipse(0,0,t.shape==='corn'?r*.58:r*.9,t.shape==='corn'?r*1.25:r,0,0,7);ctx.fill();ctx.stroke()}ctx.shadowBlur=0;ctx.fillStyle=o.rotten?'#afbd6e':t.leaf;ctx.fillRect(-r*.17,-r*1.1,r*.35,r*.35);if(o.rotten){ctx.fillStyle='#202a21';ctx.font='bold '+Math.round(r)+'px monospace';ctx.textAlign='center';ctx.fillText('☠',0,r*.3)}else{ctx.fillStyle='#ffffff70';ctx.fillRect(-r*.35,-r*.35,r*.19,r*.32)}ctx.restore()}function frame(now){let dt=Math.min(.04,(now-last)/1000||.016);last=now;ctx.clearRect(0,0,w,h);let bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#182e3d');bg.addColorStop(1,'#101725');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.strokeStyle='#b1e6a210';ctx.lineWidth=1;for(let i=0;i<w;i+=38){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,h);ctx.stroke()}for(let i=0;i<h;i+=38){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(w,i);ctx.stroke()}if(running){elapsed+=dt;seconds=Math.max(0,60-elapsed);spawn-=dt;if(spawn<=0){let n=Math.random()<.35?2:1;for(let i=0;i<n;i++)launch();spawn=Math.max(.24,.85-elapsed*.007)}comboClock-=dt;for(let o of objects){o.x+=o.vx*dt;o.y+=o.vy*dt;o.vy+=Math.max(580,h*.9)*dt;o.rot+=o.spin*dt;if(o.y>h+o.r+20&&o.vy>0){if(!o.cut&&!o.rotten){combo=0}o.cut=true}}objects=objects.filter(o=>!o.cut&&o.y<h+o.r+35);if(seconds<=0)finish();hud()}for(let o of objects)veggie(o);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=350*dt;p.life-=dt;ctx.globalAlpha=Math.min(1,Math.max(0,p.life*2));ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);for(let t of trails){t.life-=dt;ctx.globalAlpha=Math.max(0,t.life/.16);ctx.strokeStyle=blades[blade].color;ctx.lineWidth=blades[blade].width;ctx.lineCap='round';ctx.shadowColor=blades[blade].color;ctx.shadowBlur=18;ctx.beginPath();ctx.moveTo(t.x1,t.y1);ctx.lineTo(t.x2,t.y2);ctx.stroke()}ctx.globalAlpha=1;ctx.shadowBlur=0;trails=trails.filter(t=>t.life>0);if(running&&combo>1&&comboClock>0){ctx.textAlign='center';ctx.fillStyle='#ffe98c';ctx.font='900 26px system-ui';ctx.fillText('×'+combo+' COMBO!',w/2,Math.min(115,h*.22))}requestAnimationFrame(frame)}renderBlades();requestAnimationFrame(frame)})();
</script></body></html>
