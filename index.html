// Independent 2D starfield fallback: runs even when the 3D module or CDN fails.

(()=>{
'use strict';
const canvas=document.getElementById('backdrop'),g=canvas.getContext('2d',{alpha:true});

const points=Array.from({length:1000},()=>({angle:random()*6.283,r:Math.pow(random(),.72),arm:Math.floor(random()*5),z:random(),star:random()}));
const far=Array.from({length:210},()=>({x:random(),y:random(),size:.4+random()*1.5,phase:random()*7}));

addEventListener('resize',resize);resize();
function connect(){
try{
if(!context)context=new(window.AudioContext||window.webkitAudioContext)();
if(!analyser){
analyser=context.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=.65;

}catch(err){hint.textContent='AUDIO ERROR: '+err.message}
}
function band(lo,hi){const step=context.sampleRate/2048,a=clamp(Math.floor(lo/step),0,frequency.length-1),b=clamp(Math.ceil(hi/step),a,frequency.length-1);let v=0;for(let i=a;i<=b;i++)v+=frequency[i];return v/((b-a+1)*255)}

if(!analyser||audio.paused){const fade=Math.exp(-dt*3);bass*=fade;mid*=fade;high*=fade;beat*=Math.exp(-dt*4.5);return}
analyser.getByteFrequencyData(frequency);const k=1-Math.exp(-dt*15);
const b=band(25,190);bass+=(b-bass)*k;mid+=(band(190,2500)-mid)*k;high+=(band(2500,13000)-high)*k;
mean+=(b-mean)*(1-Math.exp(-dt*.8));

}
const colors=['#64eeff','#6b90ff','#ba83ff','#ff85c7','#ffd09b'];
function draw(now){
requestAnimationFrame(draw);
canvas.style.opacity=window.cosmos3DReady?'.87':'1';
const dt=clamp((now-last)/1000,.001,.05);last=now;turn+=dt*.16;
analyze(dt,now/1000);window.cosmosLevels={bass,mids:mid,treble:high,level:Math.max(mid*.85,bass*.65),beat};
const b=clamp(bass*3.5,0,3),m=clamp(mid*3.5,0,3),v=clamp(high*5,0,3),pulse=b*.6+beat*.75;
g.setTransform(scale,0,0,scale);g.clearRect(0,0,w,h);
for(const p of far){g.globalAlpha=.25+.7*(.5+.5*Math.sin(now*.0007+p.phase));g.fillStyle='#c3dfff';g.fillRect(p.x*w,p.y*h,p.size,p.size)}g.globalAlpha=1;

for(let i=0;i<points.length;i++){

if(px<0||px>w||py<0||py>h)continue;
g.globalAlpha=.38+clamp(v*.12+beat*.3,0,.56);g.fillStyle=colors[p.arm];g.beginPath();g.arc(px,py,(p.star>.92?2.1:1.1)*(1+b*.85+beat*.45),0,6.283);g.fill();
}
g.globalAlpha=1;
for(let i=0;i<4;i++){const r=rad*(.36+i*.2),a=turn*(.5+i*.12)+i*1.7,x=centerX+Math.cos(a)*r,y=centerY+Math.sin(a)*r*.62,sz=(4+i*1.2)*(1+pulse*.25);
const gradient=g.createRadialGradient(x-sz*.3,y-sz*.3,0,x,y,sz*2.4);
gradient.addColorStop(0,'#f9fbff');gradient.addColorStop(.2,['#43b7e5','#a68bff','#ff7938','#b6fbff'][i]);gradient.addColorStop(1,'#00000000');
g.fillStyle=gradient;g.beginPath();g.arc(x,y,sz*2.5,0,6.283);g.fill();}
for(let i=0;i<5;i++){const a=now*.00034*(1+pulse*.45)+i*1.3,r=rad*.85;
const x=centerX+Math.cos(a)*r,y=centerY+Math.sin(a*1.32)*rad*.5;
g.strokeStyle=['#6ae9ff','#e597ff','#ffd38d'][i%3];g.lineWidth=1.2+beat*2;g.globalAlpha=.4+.3*b;
g.beginPath();g.moveTo(x-Math.cos(a)*18*(1+pulse),y-Math.sin(a)*18*(1+pulse));g.lineTo(x,y);g.stroke();}
g.globalAlpha=.8;const sz=9+pulse*21,halo=g.createRadialGradient(centerX,centerY,0,centerX,centerY,sz*3);
halo.addColorStop(0,'#f6f7ff');halo.addColorStop(.18,'#9cd5ffcc');halo.addColorStop(.55,'#5254dc44');halo.addColorStop(1,'#00000000');
g.fillStyle=halo;g.beginPath();g.arc(centerX,centerY,sz*3,0,6.283);g.fill();
g.globalCompositeOperation='source-over';g.globalAlpha=1;
}
requestAnimationFrame(draw);
load.addEventListener('change',async e=>{
const file=e.target.files&&e.target.files[0];if(!file)return;
if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(file);
audio.src=url;audio.load();track.textContent='♫ '+file.name;connect();

function makeGlow(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),grad=g.createRadialGradient(64,64,0,64,64,64);grad.addColorStop(0,'rgba(255,255,255,1)');grad.addColorStop(.15,'rgba(160,220,255,.55)');grad.addColorStop(.45,'rgba(70,80,255,.15)');grad.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=grad;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)}
function spectrum(dt,t){const f=window.cosmosLevels||{bass:0,mids:0,treble:0,level:0,beat:0};bass=f.bass;mids=f.mids;treble=f.treble;level=f.level;beat=f.beat;}
function animate(){requestAnimationFrame(animate);const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;spectrum(dt,t);
const pulse=Math.min(3,(bass*4+mids*1.8+beat*1.5)*sensitivity);
const pos=geometry.attributes.position.array;
for(let i=0;i<count;i++){const k=i*3,r=radii[i],phase=phases[i],a=t*(.07+1/(r+4)*.3)*speed;const cs=Math.cos(a),sn=Math.sin(a),x=original[k],z=original[k+2],wave=Math.sin(t*1.8+phase+r*.7);
pos[k]=(x*cs-z*sn)*(1+pulse*.23);
pos[k+2]=(x*sn+z*cs)*(1+pulse*.23);
pos[k+1]=original[k+1]+wave*(.05+treble*sensitivity*.7)+Math.sin(t*1.2+r*.9+phase)*mids*sensitivity*.8;
}
geometry.attributes.position.needsUpdate=true;
material.uniforms.uGlow.value=glow;material.uniforms.uHue.value=hue*Math.PI/180;material.uniforms.uPulse.value=pulse;
core.scale.setScalar(.7+pulse*.35);core.rotation.y+=dt*.35;halo.scale.setScalar(5+pulse*4);halo.material.opacity=.55+Math.min(.45,level*sensitivity);ring.scale.setScalar(1+pulse*.13);ring.rotation.z+=dt*.12*speed;
galaxy.rotation.y+=dt*.025*speed;stars.rotation.y+=dt*.002;updateSpaceObjects(dt,t,pulse);updateCinematicUniverse(dt,t,pulse);
if(!drag&&touches.size===0)yaw+=dt*.035*speed;
pitch=THREE.MathUtils.clamp(pitch,-1.42,1.42);
camera.position.set(dist*Math.cos(pitch)*Math.sin(yaw),dist*Math.sin(pitch),dist*Math.cos(pitch)*Math.cos(yaw));camera.lookAt(0,0,0);
renderer.render(scene,camera);
if(!seekDrag&&Number.isFinite(audio.duration)&&audio.duration>0){$('seek').value=String(Math.round(audio.currentTime/audio.duration*1000))}$('elapsed').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration)}
function pointerDown(e){if(e.target!==renderer.domElement)return;e.preventDefault();stage.setPointerCapture(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY};lastPinch=0}
function pointerMove(e){if(!touches.has(e.pointerId))return;e.preventDefault();const prev=touches.get(e.pointerId);touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===1){yaw-=(e.clientX-prev.x)*.007;pitch+=(e.clientY-prev.y)*.007}else if(touches.size>=2){const pts=[...touches.values()],d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(lastPinch)dist=THREE.MathUtils.clamp(dist*lastPinch/Math.max(1,d),8,75);lastPinch=d}}
function pointerUp(e){touches.delete(e.pointerId);lastPinch=0;if(!touches.size)drag=null}
stage.addEventListener('pointerdown',pointerDown);stage.addEventListener('pointermove',pointerMove);stage.addEventListener('pointerup',pointerUp);stage.addEventListener('pointercancel',pointerUp);stage.addEventListener('lostpointercapture',pointerUp);stage.addEventListener('wheel',e=>{dist=THREE.MathUtils.clamp(dist+e.deltaY*.025,8,75)},{passive:true});
addEventListener('pagehide',()=>{if(url)URL.revokeObjectURL(url)});
try{init()}catch(e){$('status').textContent='3D graphics unavailable: '+e.message;console.error(e)}
</script></body></html>
