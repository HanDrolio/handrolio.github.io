<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0b18"><title>COSM.SYNTH</title><style>*{box-sizing:border-box}body{margin:0;background:#0d0b18;color:#f1eaff;font:14px system-ui,sans-serif}.app{height:100dvh;display:flex;flex-direction:column;padding:8px;gap:8px}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:18px;margin:0;color:#c39aff}button,select,input{background:#282039;color:#fff;border:1px solid #6d508e;border-radius:7px;padding:10px;font:inherit}button{cursor:pointer;touch-action:manipulation}button.primary{background:#8b4fff;font-weight:800}input{width:65px}#msg{color:#d0badc;font-size:12px}#viewport{flex:1;min-height:100px;overflow:auto;border:1px solid #544168;border-radius:8px;overscroll-behavior:contain}#grid{width:max-content}.head,.line{display:flex}.corner,.key{width:56px;flex:none;position:sticky;left:0;z-index:2;background:#30243f;display:grid;place-items:center;border-right:1px solid #8a6fa5}.head{height:28px;position:sticky;top:0;z-index:3;background:#20172d}.bar{width:384px;text-align:center;border-right:2px solid #a680d3;padding:5px;color:#d9b9ff}.line{height:35px}.key{font-size:12px}.key.black{background:#181322}.cell{width:24px;height:35px;flex:none;background:#161423;border-right:1px solid #302a3e;border-bottom:1px solid #322a42;touch-action:manipulation}.cell:nth-child(4n+1){border-left:1px solid #5b4671}.cell:nth-child(16n+1){border-left:2px solid #9972ca}.cell.on{background:#a36cff}.cell.cursor{box-shadow:inset 3px 0 #ffde75}.cell.on.cursor{background:#d49bff}footer{font-size:12px;color:#a998b9}@media(orientation:portrait){.app:before{content:"📱 Rotate sideways for the best piano roll view";font-size:12px;color:#d8bcff}}@media(max-height:430px){.app{gap:4px;padding:4px}.line,.cell{height:27px}header button,header select,header input{padding:6px}footer{display:none}}</style></head><body><div class="app"><header><h1>🟣 COSM.SYNTH</h1><button class="primary" id="play">▶ PLAY</button><button id="stop">■ STOP</button><label>BPM <input id="bpm" type="number" min="40" max="240" value="120"></label><label>OSC <select id="osc"><option value="sine">Sine</option><option value="sawtooth" selected>Saw</option><option value="square">Square</option><option value="triangle">Triangle</option></select></label><button id="clear">Clear</button><button id="full">⛶ Fullscreen</button></header><div id="msg">Tap squares to add notes. Press PLAY. Swipe horizontally for 8 bars. 🎧</div><div id="viewport"><div id="grid"><div class="head" id="head"><div class="corner">NOTES</div></div><div id="rows"></div></div></div><footer>8 bars · 16 steps per bar · C4–C5 · Web Audio · Tap a note to preview it</footer></div><script>(function(){'use strict';const names=['C5','B4','A#4','A4','G#4','G4','F#4','F4','E4','D#4','D4','C#4','C4'];const values=names.map((_,i)=>72-i);const notes=names.map(()=>new Uint8Array(128));const elements=names.map(()=>[]);const $=id=>document.getElementById(id);let audio,playing=false,step=0,next=0,timer,highlight=-1;for(let b=0;b<8;b++){let d=document.createElement('div');d.className='bar';d.textContent='BAR '+(b+1);$('head').appendChild(d)}names.forEach((name,r)=>{let row=document.createElement('div');row.className='line';let key=document.createElement('div');key.className='key'+(name.includes('#')?' black':'');key.textContent=name;row.appendChild(key);for(let s=0;s<128;s++){let el=document.createElement('div');el.className='cell';el.addEventListener('click',()=>{notes[r][s]^=1;el.classList.toggle('on',!!notes[r][s]);$('msg').textContent=name+' · bar '+(Math.floor(s/16)+1)+' · '+(notes[r][s]?'added':'removed');if(notes[r][s]){ready().then(()=>sound(values[r],audio.currentTime,.18)).catch(e=>$('msg').textContent=e.message)}});row.appendChild(el);elements[r][s]=el}$('rows').appendChild(row)});async function ready(){if(!audio){let AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw Error('Browser audio unavailable');audio=new AC()}if(audio.state!=='running')await audio.resume()}function sound(midi,time,dur){let o=audio.createOscillator(),g=audio.createGain();o.type=$('osc').value;o.frequency.value=440*Math.pow(2,(midi-69)/12);g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(.12,time+.012);g.gain.setValueAtTime(.12,time+dur*.65);g.gain.exponentialRampToValueAtTime(.0001,time+dur+.08);o.connect(g);g.connect(audio.destination);o.start(time);o.stop(time+dur+.1);o.onended=()=>{o.disconnect();g.disconnect()}}function cursor(s){if(highlight>=0)for(let r=0;r<names.length;r++)elements[r][highlight].classList.remove('cursor');highlight=s;if(s>=0)for(let r=0;r<names.length;r++)elements[r][s].classList.add('cursor')}function tick(){if(!playing)return;let dur=60/Math.max(40,Math.min(240,Number($('bpm').value)||120))/4;while(next<audio.currentTime+.1){let s=step;for(let r=0;r<names.length;r++)if(notes[r][s])sound(values[r],next,dur*.9);setTimeout(()=>{if(playing)cursor(s)},Math.max(0,(next-audio.currentTime)*1000));step=(step+1)%128;next+=dur}}$('play').onclick=async()=>{try{await ready();if(playing)return;playing=true;step=0;next=audio.currentTime+.04;timer=setInterval(tick,25);tick();$('msg').textContent='▶ Playing loop';$('play').textContent='♫ PLAYING'}catch(e){$('msg').textContent='Audio error: '+e.message}};$('stop').onclick=()=>{playing=false;clearInterval(timer);cursor(-1);$('play').textContent='▶ PLAY';$('msg').textContent='Stopped'};$('clear').onclick=()=>{notes.forEach((row,r)=>row.forEach((_,s)=>{row[s]=0;elements[r][s].classList.remove('on')}));$('msg').textContent='Notes cleared'};$('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{$('msg').textContent='Use Safari landscape mode'});else $('msg').textContent='Rotate your iPhone sideways; Safari may not support fullscreen'};notes[8][0]=1;notes[5][4]=1;notes[3][8]=1;notes[5][12]=1;for(let r=0;r<names.length;r++)for(let s=0;s<128;s++)if(notes[r][s])elements[r][s].classList.add('on');})();</script></body></html>
